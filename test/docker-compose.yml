services:

  ms-redis:
    image: "redis:7.0.12"
    ports:
      - "6379:6379"
  ms-postgres:
    image: "postgres:17.3"
    container_name: ms-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - "./init.sql:/docker-entrypoint-initdb.d/init.sql"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      LANG: en_US.UTF-8
      LC_COLLATE: en_US.UTF-8
      LC_CTYPE: en_US.UTF-8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5    
    networks:
      - social-network  

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - social-network  

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - social-network  

  ms-eureka:
    image: "nikolaykarpov/ms-eureka:2.0"
    container_name: "ms-eureka"
    restart: unless-stopped
    ports:
      - "8761:8761"
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - social-network  

  ms-gateway:
    image: "nikolaykarpov/ms-gateway:2.0"
    container_name: "ms-gateway"
    restart: unless-stopped
    ports:
      - "8765:8765"
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=docker      
    depends_on:
      ms-eureka:
        condition: service_started
    networks:
      - social-network  

  frontend:
    image: "service-front:3.0"
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - ms-gateway
    networks:
      - social-network  

  account-service:
    image: kolchenkoav/account-service:latest
    container_name: ms-account
    restart: unless-stopped
    ports:
      - "8082:8080"
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - SPRING_APPLICATION_NAME=ms-account
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ms-postgres:5432/account_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://localhost:8761/eureka
    depends_on:
      ms-postgres:
        condition: service_started
      kafka:
        condition: service_healthy
      ms-eureka:
        condition: service_started
      ms-auth:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 10
    networks:
      - social-network  
      
  ms-auth:
    image: kolchenkoav/security-service:latest
    container_name: ms-auth
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - SPRING_APPLICATION_NAME=ms-auth
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ms-postgres:5432/security_service_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://localhost:8761/eureka
    depends_on:
      ms-postgres:
        condition: service_started
      kafka:
        condition: service_healthy
      ms-eureka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 10
    networks:
      - social-network  

  ms-dialogs:
    depends_on:
      ms-eureka:
        condition: service_started
      ms-postgres:
        condition: service_started      
    image: "nikolaykarpov/ms-dialogs:2.0"
    container_name: "ms-dialogs"
    restart: unless-stopped
    ports:
      - 8077:8077
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - social-network  

  ms-friends:
    depends_on:
      ms-eureka:
        condition: service_started
      ms-postgres:
        condition: service_started      
    image: "nikolaykarpov/ms-friends:2.0"
    container_name: "ms-friends"
    restart: unless-stopped
    ports:
      - 8081:8081
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - social-network  

  ms-geo: 
    depends_on:
      ms-eureka:
        condition: service_started
      ms-postgres:
        condition: service_started     
    image: "geo-service:3.0"
    container_name: "ms-geo"
    restart: unless-stopped
    ports:
      - 8087:8087
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - social-network    

  ms-notifications:
    depends_on:
      ms-eureka:
        condition: service_started
      ms-postgres:
        condition: service_started      
    image: "nikolaykarpov/ms-notifications:2.0"
    container_name: "ms-notifications"
    restart: unless-stopped
    ports:
      - 8089:8089
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - social-network   

  ms-post:
    depends_on:
      ms-eureka:
        condition: service_started
      ms-postgres:
        condition: service_started      
    image: "nikolaykarpov/ms-post:2.0"
    container_name: "ms-post"
    restart: unless-stopped
    ports:
      - 8083:8083
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - social-network  

networks:
  social-network:
    driver: bridge
