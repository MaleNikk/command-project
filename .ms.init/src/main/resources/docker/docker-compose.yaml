services:
  mongodb:
    image: "mongo:4.4"
    container_name: "db-mongo"
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "mongo"
      MONGO_INITDB_ROOT_PASSWORD: "mongo"
      MONGO_INITDB_DATABASE: "mongo_db"
    networks:
      - test-network

  redis:
    image: "redis:7.0.12"
    container_name: "db-redis"
    ports:
      - "6379:6379"
    networks:
      - test-network

  ms-zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: "ms-zookeeper"
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 5000
    ports:
      - 2181:2181
    networks:
      - test-network

  ms-kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: "ms-kafka"
    restart: unless-stopped
    depends_on:
      ms-zookeeper:
        condition: service_started
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "ms-zookeeper:2181"
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO, kafka.producer.async.DefaultEventHandler=INFO, state.change.logger=INFO"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 9
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    networks:
      - test-network

networks:
  test-network:
    driver: bridge