services:
  mc_postgres:
    image: "postgres:17.3"
    container_name: "mc_postgres"
    ports:
      - 5432:5432
    environment:
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=postgres"
      - "POSTGRES_DB=postgres"
    volumes:
      - "./init.sql:/docker-entrypoint-initdb.d/init.sql"