server:
  port: 8077

logging:
  level:
    root: INFO
    org:
      apache: INFO
      springframework:
        web: DEBUG

eureka:
  client:
    serviceUrl:
      defaultZone: "http://localhost:8761/eureka"

spring:
  application:
    name: "ms-dialogs"
    kafka:
      bootstrap-servers: localhost:9092
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer

  datasource:
    driverClassName: "org.postgresql.Driver"
    url: "jdbc:postgresql://ms-postgres:5432/dialogs_db"
    username: "postgres"
    password: "postgres"
    hikari:
      schema: "chat"

  liquibase:
    defaultSchema: "chat"
    enabled: "true"
    changeLog: "classpath:db.changelog/changelog-master.xml"
    dropFirst: true

application:
  kafka:
    URI: "localhost:9092"
    groupId: "dialogs"
    topic: "notifications"

  security:
    URI: "http://ms-auth:8765/api/v1/auth/validate"
